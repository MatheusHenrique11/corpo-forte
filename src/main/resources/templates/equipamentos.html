<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corpo Forte Tracker — Equipamentos</title>
  <style>
    :root{
      --bg:#f6f3ee; --card:#ffffff; --ink:#1c1a17; --muted:#6b665e;
      --accent:#c9781f; --accent2:#2f6b4f; --line:#e6e0d6; --tableHead:#efe9dd;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.5; max-width:720px; margin-inline:auto; padding:24px 16px 60px;
    }
    h1{font-size:1.4rem; margin-bottom:2px;}
    .sub{color:var(--muted); margin-top:0; font-size:.88rem;}
    nav{margin:10px 0 0; font-size:.85rem;}
    nav a{color:var(--accent2); text-decoration:none; font-weight:600; margin-right:14px;}
    nav a:hover{text-decoration:underline;}
    .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0;}
    .opcao{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:.95rem;}
    .opcao:last-of-type{border-bottom:none;}
    .opcao input{width:auto; margin:0;}
    button{background:var(--accent2); color:#fff; border:none; padding:10px 18px; border-radius:10px; font-size:.9rem; font-weight:600; cursor:pointer; margin-top:12px;}
  </style>
</head>
<body>

<h1>🥋 Corpo Forte Tracker</h1>
<p class="sub">Fase 4 — equipamentos disponíveis.</p>
<nav>
  <a th:href="@{/perfil}">Perfil</a>
  <a th:href="@{/avaliacao}">Avaliação física</a>
  <a th:href="@{/peso}">Peso</a>
  <a th:href="@{/equipamentos}">Equipamentos</a>
  <a th:href="@{/exercicios}">Exercícios</a>
</nav>

<div class="card">
  <p class="sub">Marque o que você tem disponível. Isso filtra o catálogo de exercícios em <a th:href="@{/exercicios}">/exercicios</a>.</p>
  <form th:action="@{/equipamentos}" method="post">
    <div class="opcao" th:each="opcao : ${opcoes}">
      <input type="checkbox" name="equipamentos" th:id="${opcao}" th:value="${opcao}"
             th:checked="${selecionados.contains(opcao)}">
      <label th:for="${opcao}" th:text="${opcao.rotulo}" style="margin:0; text-transform:none; font-size:inherit; color:inherit;"></label>
    </div>
    <button type="submit">Salvar equipamentos</button>
  </form>
</div>

</body>
</html>
