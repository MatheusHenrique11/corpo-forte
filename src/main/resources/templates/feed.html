<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corpo Forte Tracker — Feed</title>
  <style>
    :root{
      --bg:#f6f3ee; --card:#ffffff; --ink:#1c1a17; --muted:#6b665e;
      --accent:#c9781f; --accent2:#2f6b4f; --line:#e6e0d6; --tableHead:#efe9dd;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.5; max-width:720px; margin-inline:auto; padding:24px 16px 60px;
    }
    h1{font-size:1.4rem; margin-bottom:2px;}
    .sub{color:var(--muted); margin-top:0; font-size:.88rem;}
    nav{margin:10px 0 0; font-size:.85rem;}
    nav a{color:var(--accent2); text-decoration:none; font-weight:600; margin-right:14px;}
    nav a:hover{text-decoration:underline;}
    .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0;}
    textarea{
      width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
      background:var(--bg); color:var(--ink); font-size:1rem; margin-bottom:6px;
      font-family:inherit; resize:vertical; min-height:70px;
    }
    .erro{color:#b3261e; font-size:.78rem; margin:-2px 0 10px;}
    button{background:var(--accent2); color:#fff; border:none; padding:10px 18px; border-radius:10px; font-size:.9rem; font-weight:600; cursor:pointer; margin-top:8px;}
    .post{padding:12px 0; border-bottom:1px solid var(--line);}
    .post:last-of-type{border-bottom:none;}
    .post .autor{font-weight:700; font-size:.9rem;}
    .post .quando{color:var(--muted); font-size:.72rem; margin-left:8px;}
    .post .texto{margin:4px 0 0; white-space:pre-wrap;}
    .vazio{color:var(--muted); font-size:.9rem;}
    .acoes{display:flex; align-items:center; gap:12px; margin-top:8px;}
    .curtir{background:none; border:1px solid var(--line); color:var(--muted); padding:4px 11px;
            border-radius:999px; font-size:.8rem; font-weight:600; margin:0; display:inline-flex;
            gap:6px; align-items:center;}
    .curtir.curtido{color:#b3261e; border-color:#f0c9c4; background:#fdf3f2;}
    .contagem{color:var(--muted); font-size:.75rem;}
    .comentarios{margin:10px 0 0; padding-left:12px; border-left:2px solid var(--line);}
    .comentario{padding:5px 0;}
    .comentario .autor{font-size:.82rem;}
    .comentario .texto{font-size:.9rem;}
    .form-comentario{display:flex; gap:8px; margin-top:10px;}
    .form-comentario input{flex:1; padding:7px 10px; border-radius:8px; border:1px solid var(--line);
                           background:var(--bg); color:var(--ink); font-size:.88rem; font-family:inherit;}
    .form-comentario button{margin-top:0; padding:7px 14px; font-size:.82rem;}
    .form-apagar{display:inline; margin-left:8px;}
    .apagar{background:none; border:none; padding:0; margin:0; color:var(--muted); font-size:.72rem;
            font-weight:600; text-decoration:underline; cursor:pointer;}
    .apagar:hover{color:#b3261e;}
  </style>
</head>
<body>

<h1>🥋 Corpo Forte Tracker</h1>
<p class="sub">Fase 7c — feed social com comentários, curtidas e exclusão do próprio conteúdo.</p>
<nav>
  <a th:href="@{/perfil}">Perfil</a>
  <a th:href="@{/avaliacao}">Avaliação física</a>
  <a th:href="@{/peso}">Peso</a>
  <a th:href="@{/equipamentos}">Equipamentos</a>
  <a th:href="@{/exercicios}">Exercícios</a>
  <a th:href="@{/treino-do-dia}">Treino do dia</a>
  <a th:href="@{/feed}">Feed</a>
</nav>
<p class="sub" style="margin-top:8px;">
  Olá, <b sec:authentication="principal.attributes['name']"></b> —
  <form th:action="@{/logout}" method="post" style="display:inline;">
    <button type="submit" style="background:none;border:none;padding:0;color:var(--accent2);font-weight:600;font-size:inherit;cursor:pointer;text-decoration:underline;">sair</button>
  </form>
</p>

<div class="card">
  <form th:action="@{/feed}" th:object="${postForm}" method="post">
    <textarea id="texto" th:field="*{texto}" placeholder="Compartilhe algo com a comunidade..."></textarea>
    <p class="erro" th:if="${#fields.hasErrors('texto')}" th:errors="*{texto}"></p>
    <button type="submit">Postar</button>
  </form>
</div>

<div class="card">
  <div th:if="${not #lists.isEmpty(posts)}">
    <div class="post" th:each="post : ${posts}">
      <span class="autor" th:text="${post.autorNome()}"></span>
      <span class="quando" th:text="${#temporals.format(post.criadoEm(), 'dd/MM/yyyy HH:mm')}"></span>
      <form class="form-apagar" th:if="${post.podeApagar()}"
            th:action="@{/feed/posts/{id}/apagar(id=${post.id()})}" method="post"
            onsubmit="return confirm('Apagar este post? Comentários e curtidas saem junto.');">
        <button type="submit" class="apagar" title="Apagar post">apagar</button>
      </form>
      <p class="texto" th:text="${post.texto()}"></p>

      <div class="acoes">
        <form th:action="@{/feed/posts/{id}/curtir(id=${post.id()})}" method="post">
          <button type="submit" class="curtir" th:classappend="${post.curtidoPorMim()} ? 'curtido' : ''"
                  th:title="${post.curtidoPorMim()} ? 'Descurtir' : 'Curtir'">
            <span th:text="${post.curtidoPorMim()} ? '&#9829;' : '&#9825;'"></span>
            <span th:text="${post.curtidas()}"></span>
          </button>
        </form>
        <span class="contagem"
              th:text="${#lists.size(post.comentarios())} + (${#lists.size(post.comentarios())} == 1 ? ' comentário' : ' comentários')"></span>
      </div>

      <div class="comentarios" th:if="${not #lists.isEmpty(post.comentarios())}">
        <div class="comentario" th:each="comentario : ${post.comentarios()}">
          <span class="autor" th:text="${comentario.autorNome()}"></span>
          <span class="quando" th:text="${#temporals.format(comentario.criadoEm(), 'dd/MM HH:mm')}"></span>
          <form class="form-apagar" th:if="${comentario.podeApagar()}"
                th:action="@{/feed/comentarios/{id}/apagar(id=${comentario.id()})}" method="post"
                onsubmit="return confirm('Apagar este comentário?');">
            <button type="submit" class="apagar" title="Apagar comentário">apagar</button>
          </form>
          <p class="texto" th:text="${comentario.texto()}"></p>
        </div>
      </div>

      <form class="form-comentario" th:action="@{/feed/posts/{id}/comentarios(id=${post.id()})}" method="post">
        <input type="text" name="texto" placeholder="Escreva um comentário...">
        <button type="submit">Comentar</button>
      </form>
      <p class="erro" style="margin:6px 0 0;"
         th:if="${erroComentarioPostId != null and erroComentarioPostId == post.id()}"
         th:text="${erroComentario}"></p>
    </div>
  </div>
  <p class="vazio" th:if="${#lists.isEmpty(posts)}">Ninguém postou nada ainda. Seja o primeiro!</p>
</div>

</body>
</html>
