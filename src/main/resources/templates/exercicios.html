<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corpo Forte Tracker — Exercícios</title>
  <style>
    :root{
      --bg:#f6f3ee; --card:#ffffff; --ink:#1c1a17; --muted:#6b665e;
      --accent:#c9781f; --accent2:#2f6b4f; --line:#e6e0d6; --tableHead:#efe9dd;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.5; max-width:720px; margin-inline:auto; padding:24px 16px 60px;
    }
    h1{font-size:1.4rem; margin-bottom:2px;}
    .sub{color:var(--muted); margin-top:0; font-size:.88rem;}
    nav{margin:10px 0 0; font-size:.85rem;}
    nav a{color:var(--accent2); text-decoration:none; font-weight:600; margin-right:14px;}
    nav a:hover{text-decoration:underline;}
    .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0;}
    label{display:block; font-size:.75rem; color:var(--muted); margin-bottom:3px; text-transform:uppercase; letter-spacing:.02em;}
    select{
      width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
      background:var(--bg); color:var(--ink); font-size:1rem; margin-bottom:6px;
    }
    .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
    .checkbox{display:flex; align-items:center; gap:8px; margin:10px 0 4px;}
    .checkbox input{width:auto;}
    .checkbox label{margin:0; text-transform:none; font-size:.9rem; color:var(--ink);}
    button{background:var(--accent2); color:#fff; border:none; padding:10px 18px; border-radius:10px; font-size:.9rem; font-weight:600; cursor:pointer; margin-top:8px;}
    table{width:100%; border-collapse:collapse; margin-top:4px;}
    th, td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:.85rem;}
    th{color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.02em;}
    .vazio{color:var(--muted); font-size:.9rem;}
  </style>
</head>
<body>

<h1>🥋 Corpo Forte Tracker</h1>
<p class="sub">Fase 4 — catálogo de exercícios.</p>
<nav>
  <a th:href="@{/perfil}">Perfil</a>
  <a th:href="@{/avaliacao}">Avaliação física</a>
  <a th:href="@{/peso}">Peso</a>
  <a th:href="@{/equipamentos}">Equipamentos</a>
  <a th:href="@{/exercicios}">Exercícios</a>
  <a th:href="@{/treino-do-dia}">Treino do dia</a>
  <a th:href="@{/feed}">Feed</a>
</nav>
<p class="sub" style="margin-top:8px;">
  Olá, <b sec:authentication="principal.attributes['name']"></b> —
  <form th:action="@{/logout}" method="post" style="display:inline;">
    <button type="submit" style="background:none;border:none;padding:0;color:var(--accent2);font-weight:600;font-size:inherit;cursor:pointer;text-decoration:underline;">sair</button>
  </form>
</p>

<div class="card">
  <form th:action="@{/exercicios}" method="get">
    <div class="row">
      <div>
        <label for="nivel">Nível</label>
        <select id="nivel" name="nivel">
          <option value="">Todos</option>
          <option th:each="n : ${niveis}" th:value="${n}" th:text="${n}" th:selected="${n == nivelSelecionado}"></option>
        </select>
      </div>
      <div>
        <label for="movimento">Padrão de movimento</label>
        <select id="movimento" name="movimento">
          <option value="">Todos</option>
          <option th:each="m : ${movimentos}" th:value="${m}" th:text="${m.rotulo}" th:selected="${m == movimentoSelecionado}"></option>
        </select>
      </div>
      <div>
        <label for="equipamento">Equipamento</label>
        <select id="equipamento" name="equipamento">
          <option value="">Todos</option>
          <option th:each="e : ${equipamentos}" th:value="${e}" th:text="${e.rotulo}" th:selected="${e == equipamentoSelecionado}"></option>
        </select>
      </div>
    </div>
    <div class="checkbox">
      <input type="checkbox" id="apenasCompativel" name="apenasCompativel" value="true" th:checked="${apenasCompativel}">
      <label for="apenasCompativel">Só o que dá pra fazer com meu equipamento</label>
    </div>
    <button type="submit">Filtrar</button>
  </form>
</div>

<div class="card">
  <table th:if="${not #lists.isEmpty(exercicios)}">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Padrão de movimento</th>
        <th>Nível</th>
        <th>Equipamento</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="exercicio : ${exercicios}">
        <td th:text="${exercicio.nome}"></td>
        <td th:text="${exercicio.movimento.rotulo}"></td>
        <td th:text="${exercicio.nivel}"></td>
        <td th:text="${exercicio.equipamentoNecessario.rotulo}"></td>
      </tr>
    </tbody>
  </table>
  <p class="vazio" th:if="${#lists.isEmpty(exercicios)}">Nenhum exercício encontrado com esses filtros.</p>
</div>

</body>
</html>
