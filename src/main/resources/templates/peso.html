<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corpo Forte Tracker — Registro de peso</title>
  <style>
    :root{
      --bg:#f6f3ee; --card:#ffffff; --ink:#1c1a17; --muted:#6b665e;
      --accent:#c9781f; --accent2:#2f6b4f; --line:#e6e0d6; --tableHead:#efe9dd;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.5; max-width:720px; margin-inline:auto; padding:24px 16px 60px;
    }
    h1{font-size:1.4rem; margin-bottom:2px;}
    .sub{color:var(--muted); margin-top:0; font-size:.88rem;}
    nav{margin:10px 0 0; font-size:.85rem;}
    nav a{color:var(--accent2); text-decoration:none; font-weight:600; margin-right:14px;}
    nav a:hover{text-decoration:underline;}
    .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0;}
    label{display:block; font-size:.75rem; color:var(--muted); margin-bottom:3px; text-transform:uppercase; letter-spacing:.02em;}
    input{
      width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
      background:var(--bg); color:var(--ink); font-size:1rem; margin-bottom:6px;
    }
    .erro{color:#b3261e; font-size:.78rem; margin:-2px 0 10px;}
    .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
    button{background:var(--accent2); color:#fff; border:none; padding:10px 18px; border-radius:10px; font-size:.9rem; font-weight:600; cursor:pointer; margin-top:8px;}
    .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:4px;}
    .stat{background:var(--tableHead); border-radius:10px; padding:10px 12px; text-align:center;}
    .stat b{display:block; font-size:1.15rem; color:var(--accent);}
    .stat span{font-size:.7rem; color:var(--muted);}
    table{width:100%; border-collapse:collapse; margin-top:4px;}
    th, td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:.85rem;}
    th{color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.02em;}
  </style>
</head>
<body>

<h1>🥋 Corpo Forte Tracker</h1>
<p class="sub">Fase 3 — registro de peso e tendência semanal.</p>
<nav>
  <a th:href="@{/perfil}">Perfil</a>
  <a th:href="@{/avaliacao}">Avaliação física</a>
  <a th:href="@{/peso}">Peso</a>
  <a th:href="@{/equipamentos}">Equipamentos</a>
  <a th:href="@{/exercicios}">Exercícios</a>
</nav>

<div class="card">
  <form th:action="@{/peso}" th:object="${registroPesoForm}" method="post">
    <div class="row">
      <div>
        <label for="data">Data</label>
        <input type="date" id="data" th:field="*{data}">
        <p class="erro" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></p>
      </div>
      <div>
        <label for="pesoKg">Peso (kg)</label>
        <input type="number" step="0.1" id="pesoKg" th:field="*{pesoKg}">
        <p class="erro" th:if="${#fields.hasErrors('pesoKg')}" th:errors="*{pesoKg}"></p>
      </div>
    </div>
    <button type="submit">Salvar registro</button>
  </form>
</div>

<div class="card" th:if="${tendencia != null}">
  <div class="grid">
    <div class="stat">
      <b th:text="${#numbers.formatDecimal(tendencia.mediaSemanaAtual(), 1, 1)} + ' kg'"></b>
      <span th:text="'Média da semana de ' + ${#temporals.format(tendencia.inicioSemanaAtual(), 'dd/MM')}"></span>
    </div>
    <div class="stat" th:if="${tendencia.mediaSemanaAnterior() != null}">
      <b th:text="${#numbers.formatDecimal(tendencia.mediaSemanaAnterior(), 1, 1)} + ' kg'"></b>
      <span th:text="'Média da semana de ' + ${#temporals.format(tendencia.inicioSemanaAnterior(), 'dd/MM')}"></span>
    </div>
    <div class="stat">
      <b th:if="${tendencia.variacaoKg() != null}"
         th:text="(${tendencia.variacaoKg()} > 0 ? '+' : '') + ${#numbers.formatDecimal(tendencia.variacaoKg(), 1, 1)} + ' kg'"></b>
      <b th:if="${tendencia.variacaoKg() == null}">—</b>
      <span th:text="${tendencia.direcao().rotulo}"></span>
    </div>
  </div>
</div>

<div class="card" th:if="${not #lists.isEmpty(registros)}">
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Peso (kg)</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="registro : ${registros}">
        <td th:text="${#temporals.format(registro.data, 'dd/MM/yyyy')}"></td>
        <td th:text="${registro.pesoKg}"></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
