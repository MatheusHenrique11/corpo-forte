# Texto do campo "detail" dos erros da API (ProblemDetail) que nascem no
# proprio Spring MVC. A chave e' "problemDetail." + nome completo da classe
# da excecao; sem chave aqui, o Spring usa o texto padrao dele (em ingles).
# Os argumentos {0}, {1} sao os que cada excecao fornece ao Spring.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Rota não encontrada na API.
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=O método {0} não é suportado nesta rota.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Content-Type {0} não suportado; envie application/json.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=Corpo da requisição ausente ou mal formado.
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Um ou mais campos estão inválidos.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Parâmetro obrigatório {0} ausente.
problemDetail.org.springframework.beans.TypeMismatchException=Valor {1} inválido para {0}.
