spring:
  application:
    name: corpo-forte-tracker

  datasource:
    url: jdbc:postgresql://localhost:5433/corpo_forte
    username: corpo_forte
    password: corpo_forte

  jpa:
    hibernate:
      # o schema e' controlado pelas migrations do Flyway, nunca pelo Hibernate
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Fotos (Fase 15): ate 4 por post, 5 MB cada. O limite por arquivo e' o
  # da regra; o da requisicao cabe 4 fotos + os campos de texto.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 21MB

  # Credenciais reais vem de variavel de ambiente (nunca commitadas). O
  # fallback "nao-configurado" existe so pra nao travar o boot quando as
  # variaveis nao estao setadas - o login com Google nao vai funcionar
  # nesse caso, mas o resto da app sobe normalmente. Ver README pra como
  # criar as credenciais no Google Cloud Console.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:nao-configurado}
            client-secret: ${GOOGLE_CLIENT_SECRET:nao-configurado}
            scope: openid,profile,email

server:
  port: 8090

# Especificacao OpenAPI e Swagger UI desligadas por padrao; o perfil dev
# (application-dev.yml) liga. So' a API entra na especificacao - as telas
# Thymeleaf nao fazem parte do contrato com os clientes.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**

app:
  # E-mail do dono da conta local existente antes do login chegar (Fase 6).
  # So esse e-mail, com email_verified=true no token do Google, pode
  # reivindicar a conta orfa no primeiro login - vazio (padrao) desativa a
  # reivindicacao inteiramente, nunca reivindica "o primeiro que logar".
  owner-email: ${APP_OWNER_EMAIL:}

  # API REST (Fase 10). Mesma regra das credenciais do Google: valor real
  # so' por variavel de ambiente, nunca commitado.
  auth:
    # Segredo do access token (HS256), com pelo menos 32 bytes. Vazio: um
    # segredo aleatorio por boot (tokens morrem a cada reinicio) - nunca um
    # valor padrao escrito aqui, que o repositorio e' publico.
    jwt-secret: ${APP_JWT_SECRET:}
    google:
      # Client IDs OAuth do Google (um por aplicativo cliente), separados por
      # virgula, para os quais um ID token do Google e' aceito no login pela
      # API. Vazio: login pela API desligado.
      client-ids: ${APP_GOOGLE_CLIENT_IDS:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  # Origens (aplicacoes web) que podem chamar a API pelo navegador,
  # separadas por virgula. Vazio: nenhuma origem externa.
  cors:
    origins: ${APP_CORS_ORIGINS:}

  # Fotos (Fase 15), guardadas em disco e servidas por URL assinada.
  arquivos:
    diretorio: ${APP_ARQUIVOS_DIRETORIO:./dados/arquivos}
    # Endereco publico de /arquivos, que entra nas URLs assinadas devolvidas
    # pela API (absoluto: o cliente web pode estar em outra origem).
    url-base: ${APP_ARQUIVOS_URL_BASE:http://localhost:8090/arquivos}
    # Segredo do HMAC das URLs. Vazio: aleatorio a cada boot (as URLs morrem
    # ao reiniciar), nunca um valor padrao escrito aqui.
    segredo: ${APP_ARQUIVOS_SEGREDO:}
