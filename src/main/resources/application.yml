spring:
  application:
    name: corpo-forte-tracker

  datasource:
    url: jdbc:postgresql://localhost:5433/corpo_forte
    username: corpo_forte
    password: corpo_forte

  jpa:
    hibernate:
      # o schema e' controlado pelas migrations do Flyway, nunca pelo Hibernate
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8090
